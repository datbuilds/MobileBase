<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PDF Viewer</title>
    <style>
        body {
            margin: 0;
        }
        #viewer {
            width: 100%;
            height: 100vh;
        }

    </style>
</head>
<body>
<div id="viewer"></div>
<script src="pdf.js" type="text/javascript"></script>
<script type="text/javascript">
        const pdfUrl = 'file:///android_asset/pdf/DKDK_MB_Draff.pdf'; // Điều chỉnh tên tệp PDF của bạn
        const pdfContainer = document.getElementById('viewer');

        // Khởi tạo PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'file:///android_asset/pdf.worker.js';

        // Tải và hiển thị tệp PDF
        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc) {
            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                pdfDoc.getPage(pageNum).then(function(page) {
                    const canvas = document.createElement('canvas');
                    pdfContainer.appendChild(canvas);

                    const viewport = page.getViewport({ scale: 1.5 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: canvas.getContext('2d'),
                        viewport: viewport
                    };

                    page.render(renderContext);
                });
            }
        });

</script>
</body>
</html>
